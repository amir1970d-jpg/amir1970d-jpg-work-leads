name: leads
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scraper.py
      - run: |
          git config user.name "leads-bot"
          git config user.email "leads-bot@users.noreply.github.com"
          git add leads.json
          git commit -m "update leads" || exit 0
          git push
